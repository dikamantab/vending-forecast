version: "3.8"

services:
  api:
    build: .
    container_name: vending_api
    ports:
      - "8000:8000"
    volumes:
      - ./app/ml:/app/app/ml
      - ./shared/downloads:/shared/downloads
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC}
      - DOWNLOAD_FOLDER=${DOWNLOAD_FOLDER}
      - ML_MODEL_PATH=${ML_MODEL_PATH}
    depends_on:
      - db

  mqtt_worker:
    build: .
    container_name: vending_mqtt_worker
    command: ["python", "-c", "from app.services.mqtt_worker import run_mqtt; run_mqtt()"]
    environment:
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
      - MQTT_USERNAME=${MQTT_USERNAME}
      - MQTT_PASSWORD=${MQTT_PASSWORD}
      - MQTT_TOPIC=${MQTT_TOPIC}
    depends_on:
      - api

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "password123"
      MYSQL_DATABASE: vending_forecast
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  mysql_data:
